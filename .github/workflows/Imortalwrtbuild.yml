name: ImmortalWrt JioRouter 6101 Daily Build
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  push:
    paths: ['.github/workflows/immortalwrt-6101*.yml', 'packages/pkg.sh', 'custom-pkgs/**']

permissions:
  contents: write

concurrency:
  group: immortalwrt-6101
  cancel-in-progress: false

env:
  TARGET: mediatek/filogic
  PROFILE: jiorouter_ax6000-jidu6101
  RELEASE_TAG: immortalwrt-6101
  DEFAULT_VERSION: '25.12.2'
  IW: https://downloads.immortalwrt.org

jobs:
  build:
    name: build ImmortalWrt 6101
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create uci-defaults (no model detection)
        run: |
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-jiorouter-setup <<'DEFAULTS_EOF'
          #!/bin/sh
          exec >/tmp/setup.log 2>&1

          uci set wireless.@wifi-device[0].disabled='0'
          uci set wireless.@wifi-iface[0].disabled='0'
          uci set wireless.@wifi-device[1].disabled='0'
          uci set wireless.@wifi-iface[1].disabled='0'
          uci commit wireless
          wifi reload

          cat > /usr/bin/led-wan << 'LEDEOF'
          #!/bin/sh
          trap 'exit 0' TERM INT

          PING_TARGETS="1.1.1.1 8.8.8.8"
          STATE_FILE="/tmp/router_led_state"
          CHECK_PORTS="wan lan1 lan2 lan3 lan4"

          set_led() {
              color="$1"
              mode="$2"

              r=0; g=0; b=0
              case "$color" in
                  red)              r=1 ;;
                  green)            g=1 ;;
                  blue)             b=1 ;;
                  yellow|amber)     r=1; g=1 ;;
                  cyan)             g=1; b=1 ;;
                  magenta|purple)   r=1; b=1 ;;
                  white)            r=1; g=1; b=1 ;;
              esac

              for c in red green blue; do
                  path="/sys/class/leds/${c}:status"
                  [ -d "$path" ] || continue

                  val=0
                  [ "$c" = "red" ]   && val=$r
                  [ "$c" = "green" ] && val=$g
                  [ "$c" = "blue" ]  && val=$b

                  if [ "$val" -eq 1 ] && [ "$mode" != "off" ]; then
                      if [ "$mode" = "flash" ]; then
                          echo timer > "${path}/trigger" 2>/dev/null
                          echo 500 > "${path}/delay_on" 2>/dev/null
                          echo 500 > "${path}/delay_off" 2>/dev/null
                      else
                          echo none > "${path}/trigger" 2>/dev/null
                          echo 255 > "${path}/brightness" 2>/dev/null
                      fi
                  else
                      echo none > "${path}/trigger" 2>/dev/null
                      echo 0 > "${path}/brightness" 2>/dev/null
                  fi
              done
          }

          check_internet() {
              for target in $PING_TARGETS; do
                  if ping -c 1 -W 2 "$target" >/dev/null 2>&1; then
                      return 0
                  fi
              done
              return 1
          }

          check_port_warning() {
              for port in $CHECK_PORTS; do
                  if [ -d "/sys/class/net/$port" ]; then
                      speed=$(cat "/sys/class/net/$port/speed" 2>/dev/null)
                      state=$(cat "/sys/class/net/$port/operstate" 2>/dev/null)
                      if [ "$state" = "up" ] && [ "$speed" = "100" ]; then
                          return 0
                      fi
                  fi
              done
              return 1
          }

          is_upgrading() {
              pgrep -f "sysupgrade" >/dev/null 2>&1 && return 0
              [ -e /tmp/sysupgrade ] && return 0
              [ -e /overlay/.sysupgrade ] && return 0
              [ -e /tmp/.failsafe ] && return 0
              [ -f /tmp/sysupgrade.always_force_backup ] && return 0
              ls /tmp/sysupgrade-* >/dev/null 2>&1 && return 0
              return 1
          }

          while true; do
              if is_upgrading; then
                  set_led none off
                  exit 0
              fi

              if check_internet; then
                  if check_port_warning; then
                      TARGET_COLOR="yellow"
                      TARGET_MODE="flash"
                  else
                      TARGET_COLOR="green"
                      TARGET_MODE="solid"
                  fi
              else
                  TARGET_COLOR="red"
                  TARGET_MODE="flash"
              fi

              NEW_STATE="${TARGET_COLOR}_${TARGET_MODE}"
              OLD_STATE=$(cat "$STATE_FILE" 2>/dev/null)

              if [ "$NEW_STATE" != "$OLD_STATE" ]; then
                  set_led "$TARGET_COLOR" "$TARGET_MODE"
                  echo "$NEW_STATE" > "$STATE_FILE"
              fi

              sleep 5
          done
          LEDEOF
          chmod +x /usr/bin/led-wan

          cat > /etc/init.d/ledwan << 'INITEOF'
          #!/bin/sh /etc/rc.common
          START=99
          STOP=10
          USE_PROCD=1
          start_service() {
              procd_open_instance
              procd_set_param command /usr/bin/led-wan
              procd_set_param respawn
              procd_close_instance
          }
          stop_service() {
              killall led-wan 2>/dev/null
          }
          restart() {
              stop
              start
          }
          INITEOF
          chmod +x /etc/init.d/ledwan
          /etc/init.d/ledwan enable
          /etc/init.d/ledwan start

          OWRT_VER="unknown"
          if [ -f /etc/openwrt_release ]; then
              . /etc/openwrt_release
              OWRT_VER="${DISTRIB_RELEASE:-unknown}"
          fi

          cat > /etc/banner <<BANNEREOF
          =============================================================
          #   #  ###  #   #  ###  #   # ####   ###      # ##### #   #
          ## ## #   # ##  # #   # #   # #   # #   #     #   #   ##  #
          # # # ##### # # # ##### #   # ####  #####     #   #   # # #
          #   # #   # #  ## #   #  # #  #  #  #   # #   #   #   #  ##
          #   # #   # #   # #   #   #   #   # #   #  ###  ##### #   #
          =============================================================
                                Version ${OWRT_VER}
                          Developer @RichardDawkinsIN
          =============================================================
          BANNEREOF

          if ls /etc/custom-pkgs/*.apk >/dev/null 2>&1; then
              apk add --allow-untrusted /etc/custom-pkgs/*.apk
          fi
          if [ -d /www/luci-static/aurora ]; then
              uci set luci.main.mediaurlbase='/luci-static/aurora'
              uci commit luci
          fi

          exit 0
          DEFAULTS_EOF
          chmod +x files/etc/uci-defaults/99-jiorouter-setup

      - name: Add custom theme packages (custom-pkgs/*.apk) to image
        run: |
          if ls custom-pkgs/*.apk >/dev/null 2>&1; then
            mkdir -p files/etc/custom-pkgs
            cp custom-pkgs/*.apk files/etc/custom-pkgs/
            ls -l files/etc/custom-pkgs
          else
            echo "No .apk found in custom-pkgs/, building without the theme"
          fi

      - name: Detect latest ImmortalWrt 25.12.x version
        id: ver
        run: |
          LATEST=$(curl -fsS "$IW/releases/" | grep -oE '25\.12\.[0-9]+/' | tr -d '/' | sort -uV | tail -1 || true)
          echo "Latest listed: ${LATEST:-(none)}, default: $DEFAULT_VERSION"
          VER=""
          EXT=""
          for C in $LATEST $DEFAULT_VERSION; do
            [ -n "$C" ] || continue
            for E in tar.zst tar.xz; do
              URL="$IW/releases/$C/targets/$TARGET/immortalwrt-imagebuilder-$C-${TARGET//\//-}.Linux-x86_64.$E"
              if curl -fsI "$URL" >/dev/null 2>&1; then VER="$C"; EXT="$E"; break 2; fi
            done
          done
          [ -n "$VER" ] || { echo "No usable ImmortalWrt Image Builder found"; exit 1; }
          echo "Using ImmortalWrt $VER ($EXT)"
          echo "ver=$VER" >> $GITHUB_OUTPUT
          echo "ext=$EXT" >> $GITHUB_OUTPUT

      - name: Prepare ImageBuilder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd build-essential libncurses-dev zlib1g-dev gawk gettext libssl-dev xsltproc rsync unzip python3

          VER="${{ steps.ver.outputs.ver }}"
          EXT="${{ steps.ver.outputs.ext }}"
          NAME="immortalwrt-imagebuilder-$VER-${TARGET//\//-}.Linux-x86_64"
          BASE="$IW/releases/$VER/targets/$TARGET"

          wget -q "$BASE/$NAME.$EXT"
          if [ "$EXT" = "tar.zst" ]; then
            tar --zstd -xf "$NAME.$EXT"
          else
            tar -xJf "$NAME.$EXT"
          fi
          mv "$NAME" ib

      - name: Build image
        run: |
          EXTRA=""
          if [ -f packages/pkg.sh ]; then
            EXTRA=$(sed 's/#.*//' packages/pkg.sh | tr -s ' \t\r\n' ' ')
          fi
          PKGS="luci $EXTRA"
          echo "Packages: $PKGS"

          cd ib
          make image PROFILE="$PROFILE" PACKAGES="$PKGS" FILES="$GITHUB_WORKSPACE/files"

          mkdir -p ../out
          cp bin/targets/$TARGET/*sysupgrade* ../out/ 2>/dev/null || true
          cp bin/targets/$TARGET/*factory* ../out/ 2>/dev/null || true
          cp bin/targets/$TARGET/sha256sums ../out/ 2>/dev/null || true
          [ "$(ls -A ../out)" ] || { echo "no images built"; exit 1; }
          ls -l ../out

      - name: Fetch kernel file from official ImmortalWrt
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          BASE="$IW/releases/$VER/targets/$TARGET"
          curl -fsS "$BASE/profiles.json" -o profiles.json || { echo "WARNING: profiles.json not found"; exit 0; }
          NAMES=$(jq -r --arg p "$PROFILE" '(.profiles[$p].images // [])[] | select(.type | test("kernel")) | .name' profiles.json)
          [ -n "$NAMES" ] || echo "WARNING: no kernel file found for this profile in the official release"
          for N in $NAMES; do
            echo "kernel: $N"
            wget -q -O "out/$N" "$BASE/$N"
          done
          ls -l out

      - name: Publish release (update the same release in place)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          TITLE="ImmortalWrt JioRouter 6101 - $VER (Latest build)"
          NOTES="JioRouter AX6000 JIDU6101, ImmortalWrt $VER: sysupgrade + kernel. Rebuilt daily and updated in place. Last build: $(date -u +'%Y-%m-%d %H:%M UTC')"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$TITLE" --notes "$NOTES" --latest=false
          else
            gh release create "$RELEASE_TAG" --title "$TITLE" --notes "$NOTES" --latest=false --target "$GITHUB_SHA"
          fi

          gh release upload "$RELEASE_TAG" out/* --clobber

          ls out > new.txt
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > have.txt
          grep -vxFf new.txt have.txt > stale.txt || true
          echo "Replacing old files:"; cat stale.txt
          while read -r N; do
            [ -n "$N" ] && gh release delete-asset "$RELEASE_TAG" "$N" --yes
          done < stale.txt
          gh release view "$RELEASE_TAG"
