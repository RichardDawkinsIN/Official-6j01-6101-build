name: JioRouter Auto Build
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  push:
    paths: ['defaults.sh']

permissions:
  contents: write

env:
  ASU: https://sysupgrade.openwrt.org
  TARGET: mediatek/filogic
  PROFILE: jiorouter_ax6000-jidu6j01

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: लेटेस्ट वर्शन और टैग तय करें
        id: ver
        run: |
          VER=$(curl -s https://downloads.openwrt.org/.versions.json | jq -r '.stable_version')
          HASH=$(sha256sum defaults.sh | cut -c1-8)
          echo "ver=$VER" >> $GITHUB_OUTPUT
          echo "tag=v$VER-$HASH" >> $GITHUB_OUTPUT

      - name: रिलीज़ पहले से है?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          fi

      - name: ASU से बिल्ड कराएं
        if: steps.check.outputs.exists != 'true'
        run: |
          jq -n \
            --arg v "${{ steps.ver.outputs.ver }}" \
            --arg p "$PROFILE" \
            --arg t "$TARGET" \
            --rawfile d defaults.sh \
            '{version:$v, target:$t, profile:$p, packages:[], defaults:$d}' > req.json

          curl -s -X POST $ASU/api/v1/build \
            -H "Content-Type: application/json" -d @req.json > resp.json
          HASH=$(jq -r '.request_hash' resp.json)
          [ "$HASH" != "null" ] || { cat resp.json; exit 1; }

          for i in $(seq 1 90); do
            CODE=$(curl -s -o result.json -w '%{http_code}' $ASU/api/v1/build/$HASH)
            echo "[$i] HTTP $CODE"
            [ "$CODE" = "200" ] && break
            if [ "$CODE" != "202" ]; then cat result.json; exit 1; fi
            sleep 20
          done
          [ "$CODE" = "200" ] || { echo "timeout"; exit 1; }

          mkdir out
          BIN_DIR=$(jq -r '.bin_dir' result.json)
          for N in $(jq -r '.images[] | select(.type=="sysupgrade" or .type=="factory") | .name' result.json); do
            wget -q -O "out/$N" "$ASU/store/$BIN_DIR/$N"
          done
          ls -l out

      - name: रिलीज़ बनाएं
        if: steps.check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: OpenWrt ${{ steps.ver.outputs.ver }} (JioRouter)
          files: out/*
